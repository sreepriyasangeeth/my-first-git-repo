<!DOCTYPE html>

        .page1 {

        header {

            background-color: mediumvioletred;
            color: yellow;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: yellow;
        }

        main {
            height: 85%;
            display: flex;
        }

        .left {
            background-color: coral;
            height: 100%;

            flex-direction: column;
            justify-content: center;

        .left h1 {

        .right .bottom {

            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(26, 108, 26, 0.685);
            height: 50%;


        }

        .card1 {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        .card {
            height: 100px;
            width: 100px;
            border: 3px solid rgb(180, 42, 180);
            background-color: rgb(180, 42, 180);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            justify-content: center;
            border-radius: 10px;
            color: white;
        }

        .bottom h1 {
            color: white;

        }

        .top h1 {
            color: white;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        .box1 {
            height: 100px;
            width: 100px;
            border: 3px solid rgb(78, 71, 84);
            background-color: rgb(78, 71, 84);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            justify-content: center;
            border-radius: 150px;
            color: white;
        }

        .box2 {
            height: 100px;
            width: 100px;
            border: 3px solid blue;
            background-color: blue;

            flex-direction: column;
            align-items: center;

            justify-content: center;
            border-radius: 150px;
            color: white;
        }

        .box3 {
            height: 100px;
            width: 100px;
            border: 3px solid greenyellow;
            background-color: greenyellow;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            justify-content: center;
            border-radius: 150px;
            color: white;
        }

        footer {
            background-color: white;
            display: flex;
            justify-content: center;
            justify-content: space-around;
            text-align: center;
            gap: 10px;
          
        }

        .col,.col1,.col2 {
            background-color: cadetblue;
        }

</head>
