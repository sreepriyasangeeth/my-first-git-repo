<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spering</title>
    <style>
        * {
            margin: 0;
        }

        .page1 {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: bisque;
        }

        header {
            height: 10%;
            width: 100%;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }


        .logo-area {
            display: flex;
            align-items: center;
            color: white;

        }

        header img {
            height: 60%;
            width: auto;
            margin-right: 10px;
        }


        header h1 {
            color: white;
            font-size: 24px;
            font-family: sans-serif;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-family: sans-serif;
        }

        .header-right {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .search-image-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }

        .search-image-btn img {

            height: 16px;

            width: auto;

        }

        .close-icon {
            font-size: 18px;
            margin-right: 15px;
        }

        main {
            height: 90%;
            display: flex;
        }

        .left {
            background-color: rgb(11, 53, 49);
            height: 100%;
            width: 50%;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10%;
        }

        .left h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .left p {
            color: white;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 16px;
        }

        .btn-aboutus {
            padding: 12px 30px;
            background-color: red;
            color: white;
            border: 3px solid red;
            font-weight: bold;
        }

        .btn-getaq {
            padding: 12px 30px;
            background-color: white;
            color: black;
            border: 3px solid white;
            font-weight: bold;
        }


        .right {
            background-color: aqua;
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .right img {
            width: 80%;
            height: auto;
        }

        .number-box {
            position: absolute;
            bottom: 25px;
            right: 3%;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
        }

        .arrows-container {
            position: absolute;
            bottom: -25px;
            left: 10%;
            display: flex;
            gap: 12px;
        }

        .arrow-btn {
            width: 50px;
            height: 50px;
            background-color: aqua;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-family: sans-serif;
        }

        footer {
            height: 10%;
            width: 100%;
            background-color: white;
        }
    </style>
</head>

<body>
    <div class="page1">
        <header>
            <div class="header-left">
                <div class="logo-area">
                    <img src="images/logo.png" alt="image of logo">
                    <h1>Spering</h1>
                </div>
                <nav>
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Work</a>
                    <a href="#">Category</a>
                </nav>
            </div>
            <div class="header-right">
                <nav>
                    <a href="#">Login</a>
                    <a href="#" class="search-image-btn">
                        <img src="images/search.png" alt="Search">
                    </a>
                    <a href="#" class="close-icon">X</a>
                </nav>
            </div>
        </header>
        <main>
            <div class="left">
                <h1>YOU CAN <br> HIRE FREELANCER <br> HERE</h1>
                <p>It is a long established fact that a reader will be distracted by the<br>
                    readable content of a page</p><br>
                <form>
                    <button type="submit" class="btn-aboutus">About Us</button>
                    <button type="submit" class="btn-getaq">Get A Quote</button>
                </form>

            </div>
            <div class="right">
                <img src="images/slider-img.png" alt="slider image">
                <div class="number-box">03</div>
            </div>
            <div class="arrows-container">
                <div class="arrow-btn"><- </div>
                        <div class="arrow-btn">-></div>
                </div>
        </main>
    </div>
    <footer>

    </footer>

</body>

</html>
