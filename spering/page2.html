<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page2</title>
    <style>
        * {
            margin: 0;
            font-family: sans-serif;
        }

        .page1 {
            background-color: blanchedalmond;
            height: 100vh;
        }

        .top {
            display: flex;
            height: 80%;
            width: 100%;
            background-color: white;
        }
        .top img{
            margin-top: 40px;
            margin-left: 80px;
        }

        .top .right {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            margin-left: 200px;
        }
        .top p{
            margin-top: 30px;
        }

        form {
            display: flex;
            margin-top: 50px;
            gap: 40px;
        }

        .btn-readm {
            padding: 12px 30px;
            background-color: red;
            color: white;
            border: 3px solid red;
            font-weight: bold;
        }

        .btn-hire {
            padding: 12px 30px;
            background-color: rgb(28, 26, 26);
            color: white;
            border: 3px solid rgb(28, 26, 26);
            font-weight: bold;
        }

        .bottom {
            height: 20%;
            width: 100vw;
            background-color: rgb(33, 179, 179);
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        footer h2 {
            color: white;
            margin-top: 120px;
        }

        footer hr {
            color: white;
            width: 10%;
        }
    </style>
</head>

<body>
    <div class="page1">
        <div class="top">
            <div class="left">
                <img src="images\experience-img.jpg" alt="about image">
            </div>
            <div class="right">
                <h1>BEST EXPERIENCED FREELANCER HERE</h1>
                <P>It is a long established fact that a reader will be distracted by the readable<br>
                    content of a page when looking at its layout. The point of using Lorem Ipsum is<br>
                    that it has a more-or-less normal distribution of letters, as</P>
                <form>
                    <button type="submit" class="btn-readm">Read More</button>
                    <button type="submit" class="btn-hire"> Hire </button>
                </form>
            </div>
        </div>
        <div class="bottom">
            <footer>
                    <h2>CATEGORY</h2>
                <hr>
            </footer>
        </div>
    </div>

</body>

</html>
