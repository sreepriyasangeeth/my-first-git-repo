<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
        }

        .page1 {
            height: 100vh;
            background-color: rosybrown;
            display: flex;
            justify-content: center;
        }
        


        .left {
            background-color: rgb(10, 123, 50);
            height: 100%;
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .right {
            background-color: rgb(6, 98, 151);
            height: 100%;
            width: 50%;

        }

        .right .top {
            background-color: rgb(220, 220, 122);
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .right .bottom {
            background-color: rgb(194, 94, 22);
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card1 {
            height: 80%;
            /* background-color: aliceblue; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            height: 100px;
            width: 100px;
            border: 3px solid white;
            background-color: #ff0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="page1">
        <div class="left">
            <h1>Child 1</h1>

        </div>
        <div class="right">
            <div class="top">
                <h1>inner_child 1</h1>
            </div>
            <div class="bottom">
                <h1>inner_child 2</h1>
                <div class="card1">
                    <div class="card">card1</div>
                    <div class="card">card1</div>
                    <div class="card">card1</div>
                </div>
            </div>
        </div>

    </div>
    </div>
</body>

</html>
