<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
        }

        .page1 {
            height: 100vh;
            display: flex;
            font-family: sans-serif;
            background-color: rosybrown;
        }

        .left {
            background-color: white;
            height: 100%;
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 12px;
            text-align: center;
        }


        .left p {
            font-size: 16px;
            color: grey;
            margin-bottom: 25px;
            text-align: center;
        }

        .icons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        form input {
            width: 100%;
            padding: 16px 24px;
            background-color: rgba(248, 248, 255, 0.995);
            border: 3px solid rgba(248, 248, 255, 0.995);
            border-radius: 30px;
            font-size: 15px;
            color: grey;
        }

        .btn-signin {
            width: 50%;
            padding: 14px;
            background-color: aquamarine;
            color: white;
            border: 3px solid aquamarine;
            border-radius: 30px;
            font-size: 16px;
            margin-top: 10px;
            margin-left: 80px;
        }

        .right {
            height: 100%;
            width: 35%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-color: aquamarine;
            color: white;
            text-align: center;
        }

        .right h2 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .right p {
            font-size: 16px;
            margin-bottom: 40px;
        }

        .btn-signup {
            padding: 14px 60px;
            background-color: white;
            color: black;
            border: 3px solid white;
            border-radius: 30px;
            font-size: 16px;
        }
        .or_line{
            width:70%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .or_line hr{
            width: 47%;
        }
    </style>

</head>

<body>
    <div class="page1">
        <div class="left">
            <h1>Login to Your Account</h1>
            <p>Login using social networks</p>
            <div class="icons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-google-plus"></i>
                <i class="fa-brands fa-square-linkedin"></i>

            </div>
            <div class="or_line">
                <hr> 
                <h4>OR</h4>
                <hr>
            </div>
            <form>
                <input type="text" placeholder="Email"><br>
                <input type="password" placeholder="password"><br>
                <button type="submit" class="btn-signin">Sign In</button>
            </form>
        </div>
        <div class="right">
            <h2>New Here?</h2>
            <p>Sign up and discover a great <br> amount of new opportunities!</p>
            <form>
                <button type="submit" class="btn-signup">Sign Up</button>
            </form>
        </div>
    </div>

</body>

</html>
